<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

    
    <style>
        body {
            background-image: url('https://img.freepik.com/free-vector/beautiful-watercolor-background_23-2148486848.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
        }
        .custom-card {
            transition: all 0.3s ease;
            border-radius: 20px !important;
            overflow: hidden;
        }
        .custom-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
        }
        .btn-login {
            background: linear-gradient(45deg, #0d6efd, #0043a8);
            border: none;
            border-radius: 10px;
        }
        .btn-signup {
            border-radius: 10px;
            border: 2px solid #6c757d;
        }
    </style>
</head>
<body class="bg-light p-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="card custom-card shadow-sm border-0">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="bi bi-person-badge-fill text-primary" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-2">いらっしゃいませ</h3>
                    <p class="text-muted mb-4">注文する前にログインまたはアカウント作成してください。</p>
                    
                    <div class="d-grid gap-3">
                        <button class="btn btn-primary btn-login py-3 fw-bold" onclick="location.href='login'">
                            <i class="bi bi-box-arrow-in-right me-2"></i>ログイン
                        </button>
                        <button class="btn btn-outline-secondary btn-signup py-3 fw-bold" onclick="location.href='signup'">
                            <i class="bi bi-person-plus me-2"></i>アカウント作成
                        </button>
                        <button class="btn btn-outline-secondary btn-signup py-3 fw-bold" onclick="location.href='admin/adminlogin'">
                            <i class="bi bi-shield-lock me-2"></i>管理者ログイン
                        </button>
                    </div>
                </div>
            </div>
            </div>
    </div>
</div>

</body>
</html>
