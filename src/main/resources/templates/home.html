<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

    
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }
        
        /* 進場動畫 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .custom-card {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(10px); /* 磨砂玻璃效果 */
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            transition: all 0.3s ease;
            border-radius: 20px !important;
            animation: fadeInUp 0.8s ease-out;
        }

        .custom-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
        }

        .btn-login-custom {
            background: linear-gradient(45deg, #9E76B4, #7d5b92);
            border: none;
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-login-custom:hover {
            background: linear-gradient(45deg, #7d5b92, #6a4a7e);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(158, 118, 180, 0.4);
            color: white;
        }

        .btn-outline-custom {
            color: #9E76B4 !important;
            border: 2px solid #9E76B4 !important;
            border-radius: 12px;
            background: transparent;
            transition: all 0.3s ease;
        }

        .btn-outline-custom:hover {
            background: rgba(158, 118, 180, 0.1);
            transform: translateY(-2px);
        }

        .admin-link {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .admin-link:hover {
            color: #9E76B4;
        }
    </style>
</head>
<body class="p-3">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="card custom-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <i class="bi bi- bag-heart-fill" style="font-size: 4.5rem; color: #9E76B4;"></i>
                    </div>
                    <h2 class="fw-bold mb-3" style="color: #495057;">いらっしゃいませ</h2>
                    <p class="text-muted mb-5">美味しい体験を。はじめるにはログインしてください。</p>
                    
                    <div class="d-grid gap-3">
                        <button class="btn btn-login-custom py-3 fw-bold" onclick="location.href='login'">
                            <i class="bi bi-box-arrow-in-right me-2"></i>ログイン
                        </button>
                        <button class="btn btn-outline-custom py-3 fw-bold" onclick="location.href='signup'">
                            <i class="bi bi-person-plus me-2"></i>アカウント作成
                        </button>
                    </div>

                    <div class="mt-5">
                        <a href="admin/adminlogin" class="admin-link">
                            <i class="bi bi-shield-lock me-1"></i>管理者の方はこちら
                        </a>
                    </div>
                </div>
            </div>
            </div>
    </div>
</div>

</body>
</html>
