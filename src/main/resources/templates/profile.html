<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>マイプロフィール | My Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 0; border-radius: 0 0 25px 25px; margin-bottom: 30px; }
        .avatar-circle { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.3); }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .tier-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .tier-diamond { background-color: #b9f2ff; color: #0080ff; border: 1px solid #0080ff; }
        .tier-gold { background-color: #ffd700; color: #856404; }
        .tier-silver { background-color: #e2e2e2; color: #495057; }
        .tier-bronze { background-color: #cd7f32; color: white; }
        .tier-general { background-color: #f0f0f0; color: #888; }
        .progress { height: 12px; border-radius: 10px; background-color: #e9ecef; }
        .stats-icon { font-size: 2rem; opacity: 0.3; position: absolute; right: 20px; bottom: 10px; }
        .order-item { border-left: 4px solid #667eea; margin-bottom: 10px; padding: 10px 15px; background: white; border-radius: 8px; }
    </style>
</head>
<body>

<div class="profile-header text-center">
    <div class="container">
        <div class="mb-3">
            <img th:src="${currentUser.photo != null ? currentUser.photo : 'https://via.placeholder.com/150'}" class="avatar-circle" alt="User Photo">
        </div>
        <h2 th:text="${currentUser.username}">ユーザー名</h2>
        <p class="mb-2"><i class="bi bi-envelope"></i> <span th:text="${currentUser.email}">email@example.com</span></p>
        <span class="tier-badge" 
              th:classappend="${tier == 'ダイヤ会員' ? 'tier-diamond' : 
                               (tier == 'ゴールド会員' ? 'tier-gold' : 
                               (tier == 'シルバー会員' ? 'tier-silver' : 
                               (tier == 'ブロンズ会員' ? 'tier-bronze' : 'tier-general')))}" 
              th:text="${tier}">一般会員</span>
    </div>
</div>

<div class="container">
    <div class="row">
        <!-- 會員進度卡片 -->
        <div class="col-lg-8 mb-4">
            <div class="card h-100 p-4">
                <h5 class="card-title fw-bold mb-4">ロイヤリティポイント状況</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>現在のポイント: <strong th:text="${currentUser.points}">0</strong> pt</span>
                    <span th:if="${pointsToNext > 0}">次ランクまであと: <strong th:text="${pointsToNext}">0</strong> pt</span>
                    <span th:if="${pointsToNext == 0}">最高ランクに到達しました！</span>
                </div>
                <div class="progress mb-3">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" 
                         role="progressbar" th:style="'width: ' + ${progress} + '%'"></div>
                </div>
                <p class="text-muted small">※100ptでシルバー、500ptでゴールド会員に昇格します。ポイントは購入金額の1%が付与されます。</p>
                <div class="mt-4">
                    <a href="/points-history" class="btn btn-outline-primary btn-sm">ポイント履歴を見る</a>
                    <a href="/resetName" class="btn btn-outline-secondary btn-sm">名前変更</a>
                    <a href="/forgotPassword" class="btn btn-outline-danger btn-sm">パスワード変更</a>
                    <form th:action="@{/profile/uploadPhoto}" method="post" enctype="multipart/form-data" class="d-inline-block ms-2">
                        <label for="imageFile" class="btn btn-outline-dark btn-sm m-0">写真変更</label>
                        <input type="file" id="imageFile" name="imageFile" style="display:none;" onchange="this.form.submit()">
                    </form>
                </div>
            </div>
        </div>

        <!-- 統計數據卡片 -->
        <div class="col-lg-4">
            <div class="row">
                <div class="col-12 mb-3">
                    <div class="card p-3 bg-white">
                        <div class="card-body">
                            <h6 class="text-muted">累計注文数</h6>
                            <h3 class="fw-bold" th:text="${orderCount + ' 件'}">0 件</h3>
                            <i class="bi bi-cart-check stats-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="col-12 mb-3">
                    <div class="card p-3 bg-white text-dark">
                        <div class="card-body">
                            <h6 class="text-muted">累計利用金額</h6>
                            <h3 class="fw-bold" th:text="${#numbers.formatInteger(totalSpent, 0, 'COMMA') + ' 円'}">0 円</h3>
                            <i class="bi bi-currency-yen stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-2">
        <!-- 最近訂單預覽 -->
        <div class="col-12 mb-4">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="card-title fw-bold m-0">最近の注文内容</h5>
                    <a href="/history" class="text-decoration-none">すべて見る <i class="bi bi-arrow-right"></i></a>
                </div>
                
                <div th:if="${#lists.isEmpty(recentOrders)}" class="text-center py-4">
                    <p class="text-muted">まだ注文履歴がありません。</p>
                    <a href="/menu" class="btn btn-primary">メニューを見る</a>
                </div>

                <div th:each="order : ${recentOrders}" class="order-item d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-muted small" th:text="${order.orderTime}">2023-10-01</span>
                        <div class="fw-bold">
                            <span th:each="detail, iterStat : ${order.orderDetails}" 
                                  th:text="${detail.menu.name} + (iterStat.last ? '' : ', ')">料理名</span>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold text-primary" th:text="${order.total + '円'}">1,000円</div>
                        <span th:if="${order.paymentStatus == 'true'}" class="badge bg-success">支払済</span>
                        <span th:if="${order.paymentStatus == 'false'}" class="badge bg-warning text-dark">未支払</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 導覽按鈕 -->
    <div class="text-center mb-5">
        <a href="/menu" class="btn btn-lg btn-primary px-5 rounded-pill shadow">注文を始める</a>
        <br>
        <a href="/logout" class="btn btn-link text-muted mt-3">ログアウト</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
