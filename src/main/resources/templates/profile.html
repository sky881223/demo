<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイプロフィール - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Noto Sans JP', sans-serif;
            color: #333;
        }

        /* 玻璃擬態卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            border-radius: 20px !important;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1) !important;
        }

        /* 頂部 Header 漸層 */
        .profile-header-new {
            background: linear-gradient(45deg, #9E76B4, #667eea);
            color: white;
            padding: 60px 0;
            border-radius: 0 0 50px 50px;
            margin-bottom: -50px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .avatar-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .photo-edit-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #fff;
            color: #9E76B4;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .photo-edit-btn:hover { transform: scale(1.1); background: #9E76B4; color: #fff; }

        /* 等級標籤樣式 */
        .tier-badge { padding: 6px 16px; border-radius: 50px; font-weight: bold; font-size: 0.85rem; display: inline-block; margin-top: 10px; }
        .tier-diamond { background-color: #b9f2ff; color: #0080ff; border: 1px solid #0080ff; }
        .tier-gold { background-color: #ffd700; color: #856404; }
        .tier-silver { background-color: #e2e2e2; color: #495057; }
        .tier-bronze { background-color: #cd7f32; color: white; }
        .tier-general { background-color: #f0f0f0; color: #888; }

        /* 進度條 */
        .progress { height: 14px; border-radius: 10px; background-color: rgba(0,0,0,0.05); overflow: visible; }
        .progress-bar { border-radius: 10px; position: relative; }
        .progress-bar::after {
            content: "";
            position: absolute;
            right: -5px; top: -5px;
            width: 24px; height: 24px;
            background: white; border: 4px solid #0dcaf0;
            border-radius: 50%;
        }

        /* 抽獎卡片特殊設計 */
        .lottery-box {
            background: linear-gradient(135deg, #fff9c4 0%, #fffde7 100%);
            border: 2px dashed #ffd600 !important;
        }

        .stats-icon { font-size: 2.5rem; opacity: 0.15; position: absolute; right: 15px; bottom: 10px; }
        
        .order-item { 
            border-left: 5px solid #9E76B4; 
            transition: 0.3s;
            background: rgba(255,255,255,0.5);
        }
        .order-item:hover { background: #fff; transform: translateX(5px); }
        
        .btn-action {
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<!-- 背景裝飾與 Header -->
<div class="profile-header-new text-center">
    <div class="container">
        <div class="avatar-wrapper mb-3">
            <img th:src="${currentUser.photo != null ? currentUser.photo : 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + currentUser.username}" class="avatar-circle" alt="User Photo">
            <label for="imageFile" class="photo-edit-btn">
                <i class="bi bi-camera-fill"></i>
            </label>
            <form th:action="@{/profile/uploadPhoto}" method="post" enctype="multipart/form-data" id="photoForm">
                <input type="file" id="imageFile" name="imageFile" style="display:none;" onchange="document.getElementById('photoForm').submit()">
            </form>
        </div>
        <h2 class="fw-bold mb-1" th:text="${currentUser.username}">ユーザー名</h2>
        <p class="opacity-75 mb-2"><i class="bi bi-envelope"></i> <span th:text="${currentUser.email}">email@example.com</span></p>
        <div>
            <span class="tier-badge shadow-sm" 
              th:classappend="${tier == 'ダイヤ会員' ? 'tier-diamond' : 
                               (tier == 'ゴールド会員' ? 'tier-gold' : 
                               (tier == 'シルバー会員' ? 'tier-silver' : 
                               (tier == 'ブロンズ会員' ? 'tier-bronze' : 'tier-general')))}" 
              th:text="${tier}">一般会員</span>
        </div>
    </div>
</div>

<div class="container" style="margin-top: 20px;">
    <!-- 頂部通知：抽獎結果 -->
    <div th:if="${lotteryResult}" class="alert glass-card border-0 alert-dismissible fade show shadow-sm mb-4 text-center py-3" role="alert">
        <h5 class="mb-0 text-primary"><i class="bi bi-stars me-2"></i><span th:text="${lotteryResult}">結果</span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- 左側：統計數據與快速動作 -->
        <div class="col-lg-4 mb-4">
            <div class="row g-3">
                <div class="col-12">
                    <div class="card glass-card p-4 text-center">
                        <h6 class="text-muted small text-uppercase fw-bold mb-3">現在の保有ポイント</h6>
                        <h2 class="display-5 fw-bold text-primary mb-0"><span th:text="${currentUser.points}">0</span> <small class="fs-4">pt</small></h2>
                        <hr>
                        <div class="row">
                            <div class="col-6 border-end">
                                <p class="text-muted small mb-1">注文数</p>
                                <h5 class="fw-bold mb-0" th:text="${orderCount}">0</h5>
                            </div>
                            <div class="col-6">
                                <p class="text-muted small mb-1">総額</p>
                                <h5 class="fw-bold mb-0">¥<span th:text="${#numbers.formatInteger(totalSpent, 0, 'COMMA')}">0</span></h5>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 快速按鈕 -->
                <div class="col-12">
                    <div class="card glass-card p-3">
                        <h6 class="fw-bold mb-3 px-2">アカウント設定</h6>
                        <div class="d-grid gap-2">
                            <a href="/resetName" class="btn btn-light btn-action text-start"><i class="bi bi-pencil-square me-2 text-primary"></i>名前を変更</a>
                            <a href="/forgotPassword" class="btn btn-light btn-action text-start"><i class="bi bi-shield-lock me-2 text-danger"></i>パスワード変更</a>
                            <a href="/points-history" class="btn btn-light btn-action text-start"><i class="bi bi-clock-history me-2 text-success"></i>ポイント履歴</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：主要進度、抽獎、訂單 -->
        <div class="col-lg-8 mb-4">
            <!-- 點數進度卡片 -->
            <div class="card glass-card p-4 mb-4">
                <h5 class="card-title fw-bold mb-4 text-secondary">会員ランクアップ進捗</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span class="small fw-bold">進捗状況</span>
                    <span class="small text-muted" th:if="${pointsToNext > 0}">次ランクまであと <strong class="text-primary" th:text="${pointsToNext}">0</strong> pt</span>
                    <span class="small text-success fw-bold" th:if="${pointsToNext == 0}">最高ランクです！</span>
                </div>
                <div class="progress mb-3">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" 
                         role="progressbar" th:style="'width: ' + ${progress} + '%'"></div>
                </div>
                <p class="text-muted small mb-0"><i class="bi bi-info-circle me-1"></i>購入金額の1%がポイントとして付與されます。累積消費額に応じてランクが上がります。</p>
            </div>

            <!-- 抽獎卡片 (寶くじ) -->
            <div class="card glass-card lottery-box p-4 mb-4 text-center">
                <div class="row align-items-center">
                    <div class="col-md-8 text-md-start">
                        <h5 class="fw-bold text-dark mb-1"><i class="bi bi-gift-fill text-danger me-2"></i>ポイント宝くじ</h5>
                        <p class="text-muted small mb-md-0">1回 10pt で挑戦！最大 100pt が当たるラッキーチャンス！</p>
                    </div>
                    <div class="col-md-4">
                        <form th:action="@{/play-lottery}" method="post">
                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm" 
                                    th:disabled="${currentUser.points < 10}"
                                    onclick="return confirm('10ポイントを使用して抽選しますか？');">
                                <i class="bi bi-play-circle-fill me-1"></i>今すぐ抽選
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 最近的訂單內容 -->
            <div class="card glass-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold m-0">最近の注文内容</h5>
                    <a href="/history" class="text-primary text-decoration-none small fw-bold">履歴をすべて見る <i class="bi bi-arrow-right"></i></a>
                </div>

                <div th:if="${#lists.isEmpty(recentOrders)}" class="text-center py-4">
                    <img src="https://cdn-icons-png.flaticon.com/512/4076/4076402.png" width="60" class="opacity-25 mb-3">
                    <p class="text-muted">まだ注文履歴がありません。</p>
                </div>

                <div th:each="order : ${recentOrders}" class="order-item glass-card p-3 mb-3 d-flex justify-content-between align-items-center shadow-sm">
                    <div class="ps-2">
                        <span class="text-muted small" th:text="${order.orderTime}">2023-10-01</span>
                        <div class="fw-bold text-dark">
                            <span th:each="detail, iterStat : ${order.orderDetails}" 
                                  th:text="${detail.menu.name} + (iterStat.last ? '' : ', ')">料理名</span>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold text-danger mb-1" th:text="${order.total + ' 円'}">1,000円</div>
                        <span th:if="${order.paymentStatus == 'true'}" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">支払済</span>
                        <span th:if="${order.paymentStatus == 'false'}" class="badge bg-warning-subtle text-warning border border-warning-subtle rounded-pill">未支払</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 導覽按鈕 -->
    <div class="text-center mt-2 mb-5">
        <a href="/menu" class="btn btn-lg btn-primary px-5 rounded-pill shadow-lg fw-bold" style="background: linear-gradient(45deg, #9E76B4, #667eea); border: none;">
            <i class="bi bi-cart-fill me-2"></i>注文を始める
        </a>
        <div class="mt-4">
            <a href="/logout" class="text-muted text-decoration-none small"><i class="bi bi-box-arrow-right me-1"></i>ログアウト</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
