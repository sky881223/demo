<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支払い状況 - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
            border-radius: 20px !important;
            border: none !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        .status-icon-paid {
            font-size: 4.5rem;
            color: #42b72a;
        }
        .status-icon-unpaid {
            font-size: 4.5rem;
            color: #6c757d;
        }
        .info-box {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .info-label {
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .info-value {
            font-weight: bold;
            font-size: 1.1rem;
            color: #212529;
            margin-bottom: 0;
        }
        .btn-custom {
            background-color: #9E76B4;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            padding: 14px;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #7d5b92;
            transform: translateY(-2px);
            color: white;
        }
        .link-back {
            text-align: center;
            margin-top: 15px;
            display: block;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .link-back:hover {
            color: #9E76B4;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card status-card p-4 text-center">
        <div class="mb-3">
            <i th:if="${order.paymentStatus == 'true'}" class="bi bi-check-circle-fill status-icon-paid"></i>
            <i th:if="${order.paymentStatus == 'false'}" class="bi bi-clock-history status-icon-unpaid"></i>
        </div>
        
        <h3 class="fw-bold mb-4" style="color: #495057;">注文の支払い状況</h3>

        <div th:if="${message}" class="alert alert-success py-2 small mb-4" role="alert">
            <i class="bi bi-info-circle me-1"></i> <span th:text="${message}"></span>
        </div>

        <div class="info-box text-start">
            <div class="mb-3">
                <p class="info-label">注文合計 (定価)</p>
                <p class="info-value" th:style="${order.usedPoints > 0 ? 'text-decoration: line-through; color: #6c757d; font-size: 0.9rem;' : 'color: #212529;'}" 
                   th:text="${(order.total + order.usedPoints) + ' 円'}">0 円</p>
            </div>
            <div class="mb-3" th:if="${order.usedPoints > 0}">
                <p class="info-label">ポイント割引</p>
                <p class="info-value text-success" th:text="${'- ' + order.usedPoints + ' 円'}">- 0 円</p>
            </div>
            <div class="mb-3">
                <p class="info-label" th:text="${order.usedPoints > 0 ? '最終支払金額' : '合計金額'}">最終支払金額</p>
                <p class="info-value text-danger" th:text="${order.total + ' 円'}">0 円</p>
            </div>
            <div class="mb-3">
                <p class="info-label">支払い方法</p>
                <p class="info-value">
                    <i th:if="${order.paymentMethod == 'credit_card'}" class="bi bi-credit-card me-1"></i>
                    <i th:if="${order.paymentMethod == 'cash'}" class="bi bi-cash-stack me-1"></i>
                    <span th:text="${order.paymentMethod == 'credit_card' ? 'クレジットカード' : '現金'}">現金</span>
                </p>
            </div>
            <div>
                <p class="info-label">ステータス</p>
                <span th:class="${order.paymentStatus == 'true' ? 'badge bg-success' : 'badge bg-secondary'}" 
                      th:text="${order.paymentStatus == 'true' ? '支払済' : '未払い'}">未払い</span>
            </div>
        </div>

        <!-- 打烊提醒 -->
        <div th:if="${!isOpen and order.paymentStatus == 'false'}" class="alert alert-warning small mb-3">
            現在、営業時間外のためお支払いができません。
        </div>

        <!-- 只有在未支付的情況下才顯示支付按鈕 -->
        <form th:if="${order.paymentStatus == 'false'}" action="/paymentstatus_2" method="post" class="d-grid mt-2">
            <input type="hidden" name="orderId" th:value="${order.id}" />
            <button type="submit" class="btn btn-custom" th:disabled="${!isOpen}">
                <i class="bi bi-wallet2 me-2"></i>今すぐ支払う
            </button>
        </form>

        <a href="/menu" class="link-back">
            <i class="bi bi-arrow-left me-1"></i>メニューに戻る
        </a>
    </div>
</div>
</body>
</html>
