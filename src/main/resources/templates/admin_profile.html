<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理パネル | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .admin-header { background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%); color: white; padding: 60px 0 100px; }
        .stats-container { margin-top: -60px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: all 0.3s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        .icon-box { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 15px; }
        .bg-menu { background: #e3f2fd; color: #1976d2; }
        .bg-order { background: #fff3e0; color: #f57c00; }
        .bg-revenue { background: #e8f5e9; color: #388e3c; }
        .action-btn { padding: 15px; border-radius: 12px; text-align: left; border: 1px solid #eee; background: white; width: 100%; transition: all 0.2s; }
        .action-btn:hover { background: #f8f9fa; border-color: #4ca1af; }
        .admin-avatar { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 15px; }
    </style>
</head>
<body>

<div class="admin-header text-center">
    <div class="container">
        <div class="admin-avatar shadow-sm">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2 class="fw-bold" th:text="${adminUser.username + ' 管理員'}">Admin Name</h2>
        <p class="opacity-75" th:text="${adminUser.email}">admin@example.com</p>
        <span class="badge bg-light text-dark px-3 py-2 rounded-pill">システム最高権限</span>
    </div>
</div>

<div class="container stats-container">
    <div class="row g-4 justify-content-center">
        <!-- 統計卡片 1: 菜單數量 -->
        <div class="col-md-4 col-lg-3">
            <div class="card p-4">
                <div class="icon-box bg-menu"><i class="bi bi-list-ul"></i></div>
                <h6 class="text-muted mb-1">メニュー総数</h6>
                <h2 class="fw-bold mb-0" th:text="${menuCount}">0</h2>
            </div>
        </div>
        <!-- 統計卡片 2: 訂單數量 -->
        <div class="col-md-4 col-lg-3">
            <div class="card p-4">
                <div class="icon-box bg-order"><i class="bi bi-cart-check"></i></div>
                <h6 class="text-muted mb-1">累計注文数</h6>
                <h2 class="fw-bold mb-0" th:text="${orderCount}">0</h2>
            </div>
        </div>
        <!-- 統計卡片 3: 總營收 -->
        <div class="col-md-4 col-lg-3">
            <div class="card p-4">
                <div class="icon-box bg-revenue"><i class="bi bi-currency-yen"></i></div>
                <h6 class="text-muted mb-1">売上合計額</h6>
                <h2 class="fw-bold mb-0" th:text="${#numbers.formatInteger(totalRevenue, 0, 'COMMA') + '円'}">0</h2>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-lg-10 mx-auto">
            <div class="card p-4 mb-5">
                <h5 class="fw-bold mb-4">管理クイックツール</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <a href="/admin/menu" class="text-decoration-none">
                            <div class="action-btn d-flex align-items-center">
                                <div class="fs-3 me-3 text-primary"><i class="bi bi-journal-plus"></i></div>
                                <div>
                                    <div class="fw-bold text-dark">菜單管理</div>
                                    <small class="text-muted">商品の追加・削除・価格変更を行います</small>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="/admin/history" class="text-decoration-none">
                            <div class="action-btn d-flex align-items-center">
                                <div class="fs-3 me-3 text-success"><i class="bi bi-graph-up-arrow"></i></div>
                                <div>
                                    <div class="fw-bold text-dark">注文・売上履歴</div>
                                    <small class="text-muted">全ての注文履歴と売上状況を確認します</small>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="/admin/users" class="text-decoration-none">
                            <div class="action-btn d-flex align-items-center">
                                <div class="fs-3 me-3 text-info"><i class="bi bi-people"></i></div>
                                <div>
                                    <div class="fw-bold text-dark">ユーザー管理</div>
                                    <small class="text-muted">登録ユーザーの確認・削除・ポイント管理を行います</small>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="/admin/points-history" class="text-decoration-none">
                            <div class="action-btn d-flex align-items-center">
                                <div class="fs-3 me-3 text-warning"><i class="bi bi-coin"></i></div>
                                <div>
                                    <div class="fw-bold text-dark">ポイント履歴</div>
                                    <small class="text-muted">全體ユーザーのポイント変動履歴を確認します</small>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="/admin/adminlogout" class="text-decoration-none">
                            <div class="action-btn d-flex align-items-center">
                                <div class="fs-3 me-3 text-danger"><i class="bi bi-box-arrow-right"></i></div>
                                <div>
                                    <div class="fw-bold text-dark">ログアウト</div>
                                    <small class="text-muted">安全に管理セッションを終了します</small>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
