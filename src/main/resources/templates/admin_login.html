<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-card {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 20px !important;
            animation: fadeInUp 0.6s ease-out;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #9E76B4;
            box-shadow: 0 0 0 0.25rem rgba(158, 118, 180, 0.25);
        }
        .btn-admin-custom {
            background: linear-gradient(45deg, #9E76B4, #7d5b92);
            border: none;
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .btn-admin-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(158, 118, 180, 0.4);
            color: white;
        }
        .link-back {
            text-align: center;
            margin-top: 20px;
            display: block;
            color: #6c757d;
            text-decoration: underline;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card custom-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="bi bi-shield-lock-fill" style="font-size: 3rem; color: #9E76B4;"></i>
                        </div>
                        <h3 class="fw-bold">管理者ログイン</h3>
                        <p class="text-muted small">管理パネルにアクセスするには認証が必要です</p>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger p-2 small text-center" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/admin/adminlogin_2}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small">管理者メールアドレス</label>
                            <input type="email" name="admin_email" class="form-control" placeholder="admin@example.com" required autocomplete="off" />
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small">パスワード</label>
                            <input type="password" name="admin_password" class="form-control" placeholder="••••••••" required autocomplete="off" />
                        </div>
                        <button type="submit" class="btn btn-admin-custom w-100 py-3">ログイン</button>
                    </form>
                    <a href="/" class="link-back">トップページに戻る</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
