<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文履歴</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>

    <style>
        /* 原本表格的樣式 */
        .table th {
            background-color: #9E76B4;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
            color: white;
            /* 標題文字加白色比較清楚 */
        }

        .table td {
            text-align: center;
            vertical-align: middle;
        }

        .price-text {
            color: #d9534f;
            font-weight: bold;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* 日曆的樣式 */
        #calendar {
            max-width: 100%;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
            /* 和下方表格保持距離 */
        }

        .fc-toolbar-title {
            color: #9E76B4;
            font-weight: bold;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mb-5">
        <h2 class="text-center mt-5 mb-4 fw-bold" style="color: #9E76B4;">私の注文履歴</h2>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-warning text-center shadow-sm">
            <h4>注文履歴がありません。</h4>
            <p>まだ注文をしていないようです。メニューから注文を始めましょう！</p>
            <a href="/menu" class="btn btn-primary mt-3">メニューを見る</a>
        </div>

        <div th:if="${not #lists.isEmpty(orders)}">

            <div id='calendar'></div>

            <div class="table-responsive">
                <table class="table table-hover table-bordered shadow-sm bg-white">
                    <thead>
                        <tr>
                            <th>注文名</th>
                            <th>値段</th>
                            <th>量</th>
                            <th>合計金額</th>
                            <th>支払い状況</th>
                            <th>注文日時</th>
                            <th>備考</th>
                            <th>キャンセル</th>
                            <th>支払い</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td>
                                <div th:each="detail : ${order.orderDetails}" th:text="${detail.menu.name}"></div>
                            </td>
                            <td>
                                <div th:each="detail : ${order.orderDetails}" th:text="${detail.price} + '円'"></div>
                            </td>
                            <td>
                                <div th:each="detail : ${order.orderDetails}" th:text="${detail.quantity}"></div>
                            </td>
                            <td class="price-text">
                                <span th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 0, 'POINT')}">0</span>円
                            </td>
                            <td>
                                <span
                                    th:class="${order.paymentStatus == 'true' ? 'badge bg-success' : 'badge bg-secondary'}"
                                    th:text="${order.paymentStatus == 'true' ? '支払済' : '未払い'}">未払い</span>
                            </td>
                            <td class="small"
                                th:text="${order.orderTime != null and order.orderTime.length() >= 16 ? #strings.replace(#strings.substring(order.orderTime, 0, 16), 'T', ' ') : '時間不明'}">
                            </td>
                            <td class="small text-muted" th:text="${order.note ?: '-'}">-</td>

                            <td>
                                <form th:action="@{/cancel-order}" method="post" style="display:inline;">
                                    <input type="hidden" name="orderId" th:value="${order.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('本当にキャンセルしますか？');">キャンセル</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/pay}" method="post" style="display:inline;">
                                    <input type="hidden" name="id" th:value="${order.id}" />
                                    <button type="submit" class="btn btn-primary btn-sm"
                                        th:disabled="${order.paymentStatus == 'true'}">支払い</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center mt-4">
            <button type="button" class="btn btn-secondary px-4 py-2"
                onclick="location.href='/profile'">プロフィールに戻る</button>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            if (!calendarEl) return;

            // 準備一個空的陣列來裝事件
            var calendarEvents = [];

            // 使用 Thymeleaf 的 JS 迴圈，安全地一筆一筆塞入資料
            /*[# th:each="order : ${orders}"]*/

            var paymentStatus = /*[[${order.paymentStatus}]]*/ 'false';
            var isPaid = (paymentStatus === 'true' || paymentStatus === true);
            var total = /*[[${order.total}]]*/ 0;
            var orderTime = /*[[${order.orderTime}]]*/ '';

            calendarEvents.push({
                title: (isPaid ? '済: ' : '未: ') + total + '円',
                start: orderTime,
                color: isPaid ? '#28a745' : '#dc3545'
            });

            /*[/]*/

            // 建立並渲染日曆
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                dayMaxEvents: 3, // 1日あたり3件までに制限し、超過分は「+他X件」或いは「...」表示
                locale: 'ja',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                buttonText: {
                    today: '今日',
                    month: '月',
                    list: 'リスト'
                },
                events: calendarEvents
            });

            calendar.render();
        });
    </script>

</body>

</html>
