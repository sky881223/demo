<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー管理 | 管理パネル</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .container { margin-top: 50px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .table th { background-color: #f8f9fa; }
        .btn-back { background-color: #6c757d; color: white; border-radius: 8px; transition: 0.3s; }
        .btn-back:hover { background-color: #5a6268; color: white; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: #2c3e50;"><i class="bi bi-people me-2"></i>ユーザー管理</h2>
        <a href="/admin/adminprofile" class="btn btn-back"><i class="bi bi-arrow-left me-1"></i>戻る</a>
    </div>

    <!-- 通知メッセージ -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card p-4">
        <!-- ユーザー検索バー -->
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="userSearch" class="form-control border-start-0" placeholder="名前やメールアドレスで検索...">
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ユーザー名</th>
                        <th>メールアドレス</th>
                        <th style="min-width: 180px;">ポイント管理</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td class="fw-bold" th:text="${user.username}">User Name</td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td>
                            <form th:action="@{/admin/users/updatePoints}" method="post" class="d-flex align-items-center">
                                <input type="hidden" name="userId" th:value="${user.id}">
                                <div class="input-group input-group-sm">
                                    <input type="number" name="newPoints" class="form-control text-center" th:value="${user.points}" min="0" style="max-width: 90px;">
                                    <button class="btn btn-primary" type="submit">更新</button>
                                </div>
                            </form>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/admin/users/delete}" method="post" onsubmit="return confirm('本当にこのユーザーを削除しますか？関連する注文履歴も全て削除されます。');">
                                <input type="hidden" name="userId" th:value="${user.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i> 削除
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center text-muted py-4">登録されているユーザーはいません。</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('userSearch');
        if (searchInput) {
            searchInput.addEventListener('input', function () {
                const filter = this.value.toLowerCase();
                const rows = document.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const name = row.cells[1]?.textContent.toLowerCase() || "";
                    const email = row.cells[2]?.textContent.toLowerCase() || "";
                    row.style.display = (name.includes(filter) || email.includes(filter)) ? '' : 'none';
                });
            });
        }
    });
</script>
</body>
</html>
