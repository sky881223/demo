<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー管理 | 管理パネル</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .container { margin-top: 50px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .table th { background-color: #f8f9fa; }
        .btn-back { background-color: #6c757d; color: white; border-radius: 8px; transition: 0.3s; }
        .btn-back:hover { background-color: #5a6268; color: white; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: #2c3e50;"><i class="bi bi-people me-2"></i>ユーザー管理</h2>
        <a href="/admin/adminprofile" class="btn btn-back"><i class="bi bi-arrow-left me-1"></i>戻る</a>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ユーザー名</th>
                        <th>メールアドレス</th>
                        <th>保有ポイント</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td class="fw-bold" th:text="${user.username}">User Name</td>
                        <td th:text="${user.email}">user@example.com</td>
                        <td><span class="badge bg-info text-dark" th:text="${user.points + ' pt'}">0 pt</span></td>
                        <td class="text-center">
                            <form th:action="@{/admin/users/delete}" method="post" onsubmit="return confirm('本当にこのユーザーを削除しますか？関連する注文履歴も全て削除されます。');">
                                <input type="hidden" name="userId" th:value="${user.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i> 削除
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center text-muted py-4">登録されているユーザーはいません。</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
