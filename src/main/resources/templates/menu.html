<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary-purple: #9E76B4;
            --dark-purple: #7d5b92;
            --light-bg: #fdfcff;
            --card-shadow: 0 10px 25px rgba(158, 118, 180, 0.1);
            --hover-shadow: 0 15px 35px rgba(158, 118, 180, 0.2);
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Noto Sans JP', sans-serif;
            color: #444;
        }

        .page-title {
            color: var(--primary-purple);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .menu-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            background-color: white;
            box-shadow: var(--card-shadow);
        }

        .menu-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--hover-shadow) !important;
        }

        .card-img-wrapper {
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .card-img-top {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .menu-card:hover .card-img-top {
            transform: scale(1.1);
        }

        .price-badge {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            color: var(--primary-purple);
            font-size: 1rem;
            padding: 6px 14px;
            font-weight: 700;
            border-radius: 50px;
            position: absolute;
            top: 15px;
            right: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-custom-primary {
            background: linear-gradient(45deg, var(--primary-purple), var(--dark-purple));
            border: none;
            color: white;
            border-radius: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(158, 118, 180, 0.3);
        }

        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(158, 118, 180, 0.4);
            color: white;
        }

        .action-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 25px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
            position: sticky;
            bottom: 20px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 0 10px;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: bold;
            transition: 0.3s;
            border: 2px solid transparent;
            background-color: #f0f0f0;
            color: #777;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .filter-btn.active {
            background-color: var(--primary-purple);
            color: white;
            box-shadow: 0 4px 12px rgba(158, 118, 180, 0.3);
        }

        /* 支払い方法のカスタムセレクター */
        .payment-selector {
            display: flex;
            gap: 12px;
        }
        .payment-item {
            flex: 1;
            position: relative;
        }
        .payment-label {
            display: block;
            text-align: center;
            padding: 15px 10px;
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .payment-item input[type="radio"] {
            display: none;
        }
        .payment-item input:checked + .payment-label {
            border-color: var(--primary-purple);
            background-color: #fff;
            color: var(--primary-purple);
            box-shadow: 0 8px 15px rgba(158, 118, 180, 0.15);
            transform: translateY(-2px);
        }
        .payment-label i {
            font-size: 1.5rem;
            margin-bottom: 6px;
            display: block;
        }

        /* 入力フィールドの洗練 */
        .custom-input {
            border: 1px solid #eee;
            background-color: #f8f9fa;
            border-radius: 16px !important;
            padding: 12px 18px;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .custom-input:focus {
            background-color: #fff;
            border-color: var(--primary-purple);
            box-shadow: 0 5px 15px rgba(158, 118, 180, 0.1);
            outline: none;
        }

        .form-check-input:checked {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        .category-badge {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .options-container {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 15px;
        }

        .section-label {
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    
    <div class="text-center mb-5">
        <h1 class="page-title display-5 mb-2"><i class="bi bi-stars"></i> Special Menu</h1>
        <p class="text-muted fw-bold">厳選された本日のラインナップ</p>
    </div>

    <!-- 分類切換按鈕 -->
    <div class="filter-container">
        <button type="button" class="btn btn-outline-secondary filter-btn active" data-category="all">全て</button>
        <button type="button" class="btn btn-outline-secondary filter-btn" data-category="主食">主食</button>
        <button type="button" class="btn btn-outline-secondary filter-btn" data-category="飲み物">飲み物</button>
        <button type="button" class="btn btn-outline-secondary filter-btn" data-category="デザート">デザート</button>
    </div>

    <form th:action="@{/add-to-cart}" method="POST">
        
        <div th:if="${!isOpen}" class="alert alert-danger text-center shadow-sm mb-5 rounded-4" role="alert">
            <i class="bi bi-clock-history fs-3 d-block mb-2"></i>
            <h5 class="fw-bold mb-1">ただいま営業時間外です</h5>
            <p class="mb-0">本日の注文受付時間：06:00 - 09:45</p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
            
            <div class="col menu-item-col" th:each="m : ${menus}" th:attr="data-category=${m.category ?: 'all'}">
                <div class="card h-100 shadow-sm menu-card">
                    
                    <div class="card-img-wrapper">
                        <img th:src="${m.photo != null ? m.photo : '/images/default.jpg'}" class="card-img-top" alt="Menu Image">
                        <span class="price-badge">
                            ¥<span th:text="${m.price}">0</span>
                        </span>
                    </div>

                    <div class="card-body d-flex flex-column">
                        <div class="mb-2">
                            <span class="badge rounded-pill bg-purple-subtle text-primary-emphasis border border-primary-subtle category-badge" 
                                  th:text="${m.category ?: '未分類'}" style="background-color: #f3e5f5;">カテゴリ</span>
                        </div>
                        <h4 class="card-title fw-bold mb-2" th:text="${m.name}">メニュー名</h4>
                        
                        <p class="card-text text-muted small flex-grow-1" th:text="${m.description}">料理の説明文が入ります。</p>

                        <hr class="mt-auto mb-3" style="border-color: #e9ecef;">

                        <div class="d-flex align-items-center justify-content-between">
                            <div class="form-check form-switch fs-5 mb-0">
                                <input class="form-check-input" type="checkbox" name="menuIds" th:value="${m.id}" th:id="'check_' + ${m.id}" th:disabled="${!isOpen}">
                                <label class="form-check-label small fw-bold ms-1" th:for="'check_' + ${m.id}" style="cursor: pointer;">追加</label>
                            </div>
                            
                            <div class="input-group input-group-sm" style="width: 110px;">
                                <span class="input-group-text bg-light text-secondary border-secondary-subtle">量</span>
                                <input type="number" class="form-control text-center border-secondary-subtle" th:name="'quantity_' + ${m.id}" value="1" min="1" max="10" th:disabled="${!isOpen}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="action-bar">
            <!-- 詳細設定摺疊區域 -->
            <div class="collapse" id="orderOptions">
                <div class="options-container shadow-sm border text-start">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="section-label fw-bold"><i class="bi bi-chat-right-text-fill me-2"></i>注文の備考</div>
                            <textarea name="note" class="form-control custom-input" rows="4" placeholder="アレルギーのご相談や配送への要望など..."></textarea>
                        </div>
                        <div class="col-md-6 border-start d-flex flex-column justify-content-between">
                            <!-- 支付方式 -->
                            <div class="mb-4">
                                <div class="section-label fw-bold"><i class="bi bi-credit-card-2-back-fill me-2"></i>支払い方法</div>
                                <div class="payment-selector">
                                    <div class="payment-item">
                                        <input type="radio" name="paymentMethod" id="methodCash" value="cash" checked>
                                        <label class="payment-label" for="methodCash">
                                            <i class="bi bi-cash-stack"></i>現金
                                        </label>
                                    </div>
                                    <div class="payment-item">
                                        <input type="radio" name="paymentMethod" id="methodCard" value="credit_card">
                                        <label class="payment-label" for="methodCard">
                                            <i class="bi bi-credit-card"></i>カード
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <!-- 點數折抵 -->
                            <div th:if="${session.user != null}">
                                <div class="section-label fw-bold"><i class="bi bi-star-fill me-2 text-warning"></i>ポイント利用</div>
                                <div class="input-group shadow-sm" style="border-radius: 16px; overflow: hidden;">
                                    <input type="number" name="usedPoints" class="form-control custom-input border-0" min="0" th:max="${session.user.points}" value="0">
                                    <span class="input-group-text bg-light border-0 text-muted small px-3">
                                        / <span th:text="${session.user.points}" class="ms-1 fw-bold">0</span> pt
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 精簡後的主操作列 -->
            <div class="row align-items-center justify-content-center g-2">
                <div class="col-auto">
                    <button type="button" class="btn btn-outline-secondary px-3 py-2" data-bs-toggle="collapse" data-bs-target="#orderOptions" title="注文オプション">
                        <i class="bi bi-sliders"></i>
                    </button>
                </div>
                <div class="col-md-5 col-8">
                    <button type="submit" class="btn btn-custom-primary w-100 py-2 fw-bold" th:disabled="${!isOpen}">
                        <i class="bi bi-cart-check me-2"></i> 注文を確定する
                    </button>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-light px-3 py-2 border" onclick="location.href='/profile'" title="プロフィール">
                        <i class="bi bi-person-circle fs-5"></i>
                    </button>
                </div>
            </div>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.filter-btn').forEach(button => {
        button.addEventListener('click', () => {
            const category = button.getAttribute('data-category');
            
            // 切換按鈕狀態
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            // 篩選餐點卡片
            document.querySelectorAll('.menu-item-col').forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
</script>
</body>
</html>
