<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* 頂部標題 */
        .page-title {
            color: #9E76B4;
            font-weight: bold;
        }

        /* 卡片本體設計 */
        .menu-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            background-color: white;
        }

        /* 卡片懸停特效：整張卡片往上浮，陰影加深 */
        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
        }

        /* 圖片容器與特效 */
        .card-img-wrapper {
            height: 200px; /* 固定圖片高度，才不會有些高有些矮 */
            overflow: hidden;
        }
        .card-img-top {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        /* 滑鼠移過去時，圖片微微放大 */
        .menu-card:hover .card-img-top {
            transform: scale(1.08);
        }

        /* 價格標籤設計 (紫色系) */
        .price-badge {
            background-color: #f5f0f7;
            color: #9E76B4;
            font-size: 1rem;
            padding: 8px 15px;
            font-weight: bold;
        }

        /* 自訂主要按鈕 (紫色) */
        .btn-custom-primary {
            background-color: #9E76B4;
            border-color: #9E76B4;
            color: white;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn-custom-primary:hover {
            background-color: #7d5b92;
            border-color: #7d5b92;
            transform: translateY(-2px);
            color: white;
        }
        .btn-custom-primary:disabled {
            background-color: #cccccc;
            border-color: #cccccc;
            transform: none;
        }

        /* 底部操作列 (懸浮設計) */
        .action-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            position: sticky;
            bottom: 20px;
            z-index: 1000;
        }

        /* 分類按鈕樣式 */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .filter-btn {
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: bold;
            transition: 0.3s;
        }
        .filter-btn.active {
            background-color: #9E76B4;
            color: white;
            border-color: #9E76B4;
        }
    </style>
</head>
<body>

<div class="container py-5">
    
    <div class="text-center mb-5">
        <h2 class="page-title"><i class="bi bi-shop"></i> 本日のメニュー</h2>
        <p class="text-muted">お好きなメニューを選んで、注文を追加してください</p>
    </div>

    <!-- 分類切換按鈕 -->
    <div class="filter-container">
        <button type="button" class="btn btn-outline-secondary filter-btn active" data-category="all">全て</button>
        <button type="button" class="btn btn-outline-secondary filter-btn" data-category="主食">主食</button>
        <button type="button" class="btn btn-outline-secondary filter-btn" data-category="飲み物">飲み物</button>
        <button type="button" class="btn btn-outline-secondary filter-btn" data-category="デザート">デザート</button>
    </div>

    <form th:action="@{/add-to-cart}" method="POST">
        
        <div th:if="${!isOpen}" class="alert alert-danger text-center shadow-sm mb-5 rounded-4" role="alert">
            <i class="bi bi-clock-history fs-3 d-block mb-2"></i>
            <h5 class="fw-bold mb-1">ただいま営業時間外です</h5>
            <p class="mb-0">本日の注文受付時間：06:00 - 09:45</p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
            
            <div class="col menu-item-col" th:each="m : ${menus}" th:attr="data-category=${m.category ?: 'all'}">
                <div class="card h-100 shadow-sm menu-card">
                    
                    <div class="card-img-wrapper">
                        <img th:src="${m.photo != null ? m.photo : '/images/default.jpg'}" class="card-img-top" alt="Menu Image">
                    </div>

                    <div class="card-body d-flex flex-column">
                        <div class="mb-2">
                            <span class="badge bg-light text-dark border" th:text="${m.category ?: '未分類'}">カテゴリ</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h4 class="card-title fw-bold mb-0" th:text="${m.name}">メニュー名</h4>
                            <span class="badge rounded-pill price-badge">
                                <span th:text="${m.price}">0</span> 円
                            </span>
                        </div>
                        
                        <p class="card-text text-muted flex-grow-1" th:text="${m.description}">おいしい</p>

                        <hr class="mt-auto mb-3" style="border-color: #e9ecef;">

                        <div class="d-flex align-items-center justify-content-between">
                            <div class="form-check form-switch fs-5 mb-0">
                                <input class="form-check-input" type="checkbox" name="menuIds" th:value="${m.id}" th:id="'check_' + ${m.id}" th:disabled="${!isOpen}">
                                <label class="form-check-label fs-6 fw-bold ms-1" th:for="'check_' + ${m.id}" style="cursor: pointer;">選択</label>
                            </div>
                            
                            <div class="input-group input-group-sm" style="width: 110px;">
                                <span class="input-group-text bg-light text-secondary border-secondary-subtle">量</span>
                                <input type="number" class="form-control text-center border-secondary-subtle" th:name="'quantity_' + ${m.id}" value="1" min="1" th:disabled="${!isOpen}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="action-bar">
            <!-- 詳細設定摺疊區域 -->
            <div class="collapse" id="orderOptions">
                <div class="row g-3 mb-3 text-start">
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-muted small"><i class="bi bi-pencil-square me-1"></i> 注文の備考</label>
                        <textarea name="note" class="form-control form-control-sm" rows="2" placeholder="アレルギーやご要望など" style="border-radius: 10px;"></textarea>
                    </div>
                    <div class="col-md-6">
                        <!-- 支付方式 -->
                        <div class="p-2 border rounded bg-light mb-2">
                            <label class="form-label fw-bold text-muted small d-block mb-1"><i class="bi bi-credit-card me-1"></i> 支払い方法</label>
                            <div class="form-check form-check-inline small">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="methodCash" value="cash" checked>
                                <label class="form-check-label" for="methodCash">現金</label>
                            </div>
                            <div class="form-check form-check-inline small">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="methodCard" value="credit_card">
                                <label class="form-check-label" for="methodCard">カード</label>
                            </div>
                        </div>
                        <!-- 點數折抵 -->
                        <div class="p-2 border rounded bg-light" th:if="${session.user != null}">
                            <label class="form-label fw-bold text-muted small d-block mb-1"><i class="bi bi-star me-1"></i> ポイント利用 (保有: <span th:text="${session.user.points}">0</span> pt)</label>
                            <div class="input-group input-group-sm">
                                <input type="number" name="usedPoints" class="form-control" min="0" th:max="${session.user.points}" value="0">
                                <span class="input-group-text">pt</span>
                            </div>
                        </div>
                    </div>
                </div>
                <hr class="my-3 opacity-25">
            </div>

            <!-- 精簡後的主操作列 -->
            <div class="row align-items-center justify-content-center g-2">
                <div class="col-auto">
                    <button type="button" class="btn btn-outline-secondary px-3 py-2" data-bs-toggle="collapse" data-bs-target="#orderOptions" title="注文オプション">
                        <i class="bi bi-sliders"></i>
                    </button>
                </div>
                <div class="col-md-7">
                    <button type="submit" class="btn btn-custom-primary w-100 py-3 fw-bold fs-5" th:disabled="${!isOpen}">
                        <i class="bi bi-cart-check me-2"></i> 注文を確定する
                    </button>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-light px-3 py-2 border" onclick="location.href='/profile'" title="プロフィール">
                        <i class="bi bi-person-circle fs-5"></i>
                    </button>
                </div>
            </div>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.filter-btn').forEach(button => {
        button.addEventListener('click', () => {
            const category = button.getAttribute('data-category');
            
            // 切換按鈕狀態
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            // 篩選餐點卡片
            document.querySelectorAll('.menu-item-col').forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
</script>
</body>
</html>
