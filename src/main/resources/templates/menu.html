<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Menu - おすすめメニュー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; }
        .hero-section { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; padding: 50px 0; border-radius: 0 0 40px 40px; margin-bottom: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .ranking-card { border: none; border-radius: 20px; transition: all 0.3s ease; background: white; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .ranking-card:hover { transform: translateY(-10px); }
        .rank-badge { position: absolute; top: 12px; left: 12px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; z-index: 10; font-size: 0.9rem; }
        .rank-1 { background: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .rank-2 { background: #c0c0c0; }
        .rank-3 { background: #cd7f32; }
        .menu-img { width: 100%; height: 200px; object-fit: cover; }
        .category-pill { background: #eee; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; color: #666; }
        .cart-sticky { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; border-radius: 20px 20px 0 0; }
        .btn-order { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); border: none; color: white; font-weight: bold; border-radius: 10px; padding: 10px 30px; }
        
        /* 禁用狀態的灰色按鈕樣式 */
        .btn-order:disabled { background: #cccccc !important; color: #666666 !important; cursor: not-allowed; }
        .add-to-cart-btn:disabled { background-color: #cccccc !important; border-color: #cccccc !important; color: #666666 !important; cursor: not-allowed; }

        /* 新增的數量控制器樣式 */
        .quantity-control { display: flex; align-items: center; justify-content: flex-end; width: 100%; }
        .quantity-control .btn { padding: 0.3rem 0.6rem; font-size: 0.9rem; border-radius: 8px; }
        .quantity-control .quantity-display { width: 45px; text-align: center; border: none; background: transparent; font-weight: bold; color: #333; padding: 0; }
        .quantity-control .input-group { flex-wrap: nowrap; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .quantity-control .input-group .btn { border-radius: 0; }
        .quantity-control .input-group .btn:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .quantity-control .input-group .btn:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        .category-filter { overflow-x: auto; white-space: nowrap; padding: 10px 0 20px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .category-filter::-webkit-scrollbar { display: none; }
        .filter-btn { border: 1px solid #ddd; background: white; padding: 6px 18px; border-radius: 20px; margin-right: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; color: #555; }
        .filter-btn.active { background: #2575fc; color: white; border-color: #2575fc; box-shadow: 0 4px 12px rgba(37, 117, 252, 0.3); }
        .filter-btn:hover:not(.active) { background: #f0f0f0; }
        .price-badge { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.9); padding: 3px 12px; border-radius: 20px; font-weight: bold; color: #ff416c; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; font-size: 0.9rem; }
        .menu-item-card { transition: all 0.3s ease; }
        .text-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div class="hero-section text-center position-relative">
    <div class="container">
        <div class="position-absolute top-0 end-0 p-3">
            <a href="/profile" class="btn btn-sm btn-outline-light rounded-pill px-3 shadow-sm">
                <i class="bi bi-person-circle me-1"></i>マイページ
            </a>
        </div>
        <h1 class="display-6 fw-bold">🍽️ 特別な一皿をあなたに</h1>
        <p class="opacity-75 mb-0">厳選された素材で作る、最高のお食事をお楽しみください</p>
    </div>
</div>

<div class="container mb-5 pb-5">
    <!-- 1. 排行榜區塊 -->
    <div th:if="${not #lists.isEmpty(topMenus)}" class="mb-5">
        <h5 class="mb-3 fw-bold text-secondary"><i class="fas fa-crown text-warning me-2"></i>本日の人気ランキング</h5>
        <div class="row g-4">
        <div th:each="menu, iterStat : ${topMenus}" class="col-md-4">
            <div class="ranking-card position-relative h-100">
                <div th:class="'rank-badge rank-' + ${iterStat.count}">
                    <i th:if="${iterStat.count == 1}" class="fas fa-crown"></i>
                    <span th:if="${iterStat.count > 1}" th:text="${iterStat.count}"></span>
                </div>
                <div class="price-badge" th:text="${menu.price} + ' 円'">価格</div>
                <img th:src="${menu.photo}" class="menu-img" alt="menu-image">
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="category-pill" th:text="${menu.category}">カテゴリー</span>
                    </div>
                    <h5 class="fw-bold mb-1" th:text="${menu.name}">メニュー名</h5>
                    <p class="small text-muted mb-0 text-truncate-2" th:text="${menu.description}">商品の詳細説明が入ります。</p>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- 營業時間警告 -->
    <div th:if="${!isOpen}" class="alert alert-light border-0 shadow-sm text-center mb-5 py-3" style="border-radius: 15px;">
        <i class="fas fa-clock text-warning me-2"></i>
        <span class="fw-bold text-secondary">申し訳ございません。現在は営業時間外です。</span><br>
        <small class="text-muted">【営業時間 06:00 ～ 09:45】</small>
    </div>

    <!-- 2. 全部菜單與表單 -->
    <form th:action="@{/add-to-cart}" method="post" id="orderForm">
        <h4 class="mb-3 fw-bold"><i class="fas fa-list-ul me-2 text-primary"></i>メニュー一覧</h4>
        
        <!-- 標籤篩選列 (Dynamic Tags) -->
        <div class="category-filter mb-4">
            <button type="button" class="filter-btn active" data-filter="all">全部</button>
            <button type="button" class="filter-btn"
                    th:each="cat : ${orderedCategories}"
                    th:data-filter="${cat}" th:text="${cat}">カテゴリ</button>
        </div>

        <div class="row g-3" id="menuContainer">
            <div th:each="menu : ${menus}" class="col-6 col-md-3 menu-item-card" th:data-category="${menu.category}">
                <div class="card h-100 border-0 shadow-sm ranking-card position-relative" style="border-radius: 15px;">
                    <div class="price-badge" th:text="${menu.price} + ' 円'">¥500</div>
                    <img th:src="${menu.photo}" class="card-img-top" style="height: 120px; object-fit: cover;">
                    <div class="card-body p-2">
                        <span class="category-pill d-inline-block mb-1" style="font-size: 0.65rem; padding: 2px 8px;" th:text="${menu.category}">カテゴリー</span>
                        <h6 class="fw-bold mb-2 text-truncate" th:text="${menu.name}">メニュー名</h6>
                        <p class="small text-muted mb-2 text-truncate-2" th:text="${menu.description}">商品の詳細説明が入ります。</p>

                        <!-- 重新設計的數量控制器 -->
                        <div class="quantity-control mt-2">
                            <!-- 初始狀態：顯示「追加」按鈕 -->
                            <button type="button" class="btn btn-sm btn-primary add-to-cart-btn" 
                                    th:data-menu-id="${menu.id}" th:disabled="${!isOpen}">
                                <i class="fas fa-plus me-1"></i>追加
                            </button>

                            <!-- 數量控制器 (預設隱藏) -->
                            <div class="input-group quantity-group" style="display: none;">
                                <button type="button" class="btn btn-sm btn-outline-secondary quantity-minus" th:data-menu-id="${menu.id}">-</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary quantity-minus" th:data-menu-id="${menu.id}" th:disabled="${!isOpen}">-</button>
                                <input type="number" class="form-control form-control-sm text-center quantity-display" value="0" min="0" readonly>
                                <button type="button" class="btn btn-sm btn-outline-secondary quantity-plus" th:data-menu-id="${menu.id}">+</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary quantity-plus" th:data-menu-id="${menu.id}" th:disabled="${!isOpen}">+</button>
                                <!-- 隱藏的 input 欄位，用於提交選中的 menuId 和數量 -->
                                <input type="hidden" th:value="${menu.id}" class="hidden-menu-id">
                                <input type="hidden" th:name="'quantity_' + ${menu.id}" class="hidden-quantity" value="0">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 浮動操作列 -->
        <div class="cart-sticky">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-3 mb-2 mb-md-0">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-0" data-bs-toggle="tooltip" data-bs-placement="top" 
                                  th:title="'現在の保有ポイント: ' + ${currentUser?.points ?: 0} + ' pt'">
                                <i class="fas fa-coins text-warning"></i></span>
                            <input type="number" name="usedPoints" class="form-control border-0 bg-light" 
                                   placeholder="利用ポイント" min="0" value="0" th:disabled="${!isOpen}">
                        </div>
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <select name="paymentMethod" class="form-select form-select-sm border-0 bg-light" th:disabled="${!isOpen}">
                            <option value="cash">現金払い</option>
                            <option value="credit_card">カード決済</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <input type="text" name="note" class="form-control form-control-sm border-0 bg-light" 
                               placeholder="備考（アレルギーなど）" th:disabled="${!isOpen}">
                    </div>
                    <div class="col-md-3 text-end">
                        <button type="submit" class="btn btn-order w-100" th:disabled="${!isOpen}">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${isOpen ? '注文を確定する' : '営業時間外'}">注文を確定する</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- 分類篩選邏輯 ---
        const filterBtns = document.querySelectorAll('.filter-btn');
        const menuItems = document.querySelectorAll('.menu-item-card');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');

                menuItems.forEach(item => {
                    const itemCategory = item.getAttribute('data-category');
                    if (filterValue === 'all' || itemCategory === filterValue) {
                        item.style.display = 'block'; // 顯示
                    } else {
                        item.style.display = 'none';   // 隱藏
                    }
                });
            });
        });

        // --- 數量控制器邏輯 ---
        const orderForm = document.getElementById('orderForm');

        // 處理「追加」按鈕點擊
        document.querySelectorAll('.add-to-cart-btn').forEach(button => {
            button.addEventListener('click', function() {
                const menuId = this.dataset.menuId;
                const quantityGroup = this.nextElementSibling; // 數量控制器
                const quantityDisplay = quantityGroup.querySelector('.quantity-display');
                const hiddenQuantity = quantityGroup.querySelector('.hidden-quantity');
                const hiddenMenuId = quantityGroup.querySelector('.hidden-menu-id');

                this.style.display = 'none'; // 隱藏「追加」按鈕
                quantityGroup.style.display = 'flex'; // 顯示數量控制器
                
                quantityDisplay.value = 1; // 預設數量為 1
                hiddenQuantity.value = 1;
                
                // 確保 hidden-menu-id 被啟用，以便提交
                hiddenMenuId.name = 'menuIds'; 
            });
        });

        // 處理「+」按鈕點擊
        document.querySelectorAll('.quantity-plus').forEach(button => {
            button.addEventListener('click', function() {
                const group = this.closest('.quantity-group');
                const quantityDisplay = group.querySelector('.quantity-display');
                const hiddenQuantity = group.querySelector('.hidden-quantity');
                
                let currentQuantity = parseInt(quantityDisplay.value);
                currentQuantity++;
                quantityDisplay.value = currentQuantity;
                hiddenQuantity.value = currentQuantity;
            });
        });

        // 處理「-」按鈕點擊
        document.querySelectorAll('.quantity-minus').forEach(button => {
            button.addEventListener('click', function() {
                const group = this.closest('.quantity-group');
                const quantityDisplay = group.querySelector('.quantity-display');
                const hiddenQuantity = group.querySelector('.hidden-quantity');
                const hiddenMenuId = group.querySelector('.hidden-menu-id');
                const addToCartBtn = this.closest('.quantity-control').querySelector('.add-to-cart-btn');

                let currentQuantity = parseInt(quantityDisplay.value);
                if (currentQuantity > 0) {
                    currentQuantity--;
                    quantityDisplay.value = currentQuantity;
                    hiddenQuantity.value = currentQuantity;

                    if (currentQuantity === 0) {
                        group.style.display = 'none'; // 隱藏數量控制器
                        addToCartBtn.style.display = 'block'; // 顯示「追加」按鈕
                        hiddenMenuId.name = ''; // 禁用 hidden-menu-id，不提交此餐點
                    }
                }
            });
        });

        // --- Tooltip 初始化 ---
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        });
    });
</script>
</body>
</html>
