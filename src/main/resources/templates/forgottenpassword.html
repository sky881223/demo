<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リセット</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-register {
            width: 100%;
            padding: 10px;
            background-color: #42b72a; 
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-back {
            margin-top: 15px;
            background: none;
            border: none;
            color: #0866ff;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<div class="container">
    <h2>パスワードを忘れた</h2>
    <form th:action="@{/forgottenpassword_2}" method="post">
        <p th:if="${message}" th:text="${message}" style="color: green;"></p>
        <p th:if="${error}" th:text="${error}" style="color: red;"></p>
        <input type="email" name="email" placeholder="メールアドレス" required autocomplete="off">
        <input type="password" name="newpassword" placeholder="新しいパスワード" required autocomplete="off">          
        <button type="submit" class="btn-register">パスワードをリセット</button>
    </form>
    <button class="btn-back" onclick="location.href='login'">ログイン</button>
</div>

</html>
