<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードを忘れた方 - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .forgot-card {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
            border-radius: 20px !important;
            border: none !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important;
            max-width: 450px;
            width: 100%;
            margin: auto;
        }
        .header-icon {
            font-size: 3.5rem;
            color: #9E76B4;
            margin-bottom: 15px;
        }
        .btn-custom {
            background-color: #9E76B4;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            padding: 12px;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #7d5b92;
            transform: translateY(-2px);
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #9E76B4;
            box-shadow: 0 0 0 0.25rem rgba(158, 118, 180, 0.25);
        }
        .link-back {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .link-back:hover {
            color: #9E76B4;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card forgot-card p-4 p-md-5">
        <div class="text-center">
            <i class="bi bi-shield-lock header-icon"></i>
            <h3 class="fw-bold mb-2">パスワードの再設定</h3>
            <p class="text-muted small mb-4">ご登録のメールアドレスを入力して、新しいパスワードを設定してください。</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgottenpassword_2}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold text-muted small"><i class="bi bi-envelope me-1"></i> メールアドレス</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-muted small"><i class="bi bi-key me-1"></i> 新しいパスワード</label>
                <input type="password" name="newpassword" class="form-control" placeholder="8文字以上 (大小英數字含む)" required>
                <div class="form-text mt-2" style="font-size: 0.75rem; color: #888;">
                    ※ 8文字以上、大文字・小文字・数字を組み合わせてください。
                </div>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-custom">
                    <i class="bi bi-send-fill me-2"></i>認証コードを送信する
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="link-back">
                <i class="bi bi-arrow-left me-1"></i> ログイン画面に戻る
            </a>
        </div>
    </div>
</div>
</body>
</html>
