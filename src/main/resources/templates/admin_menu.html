<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー追加・管理</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Noto Sans JP', sans-serif; 
        }

        /* 卡片統一樣式 */
        .admin-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            background-color: white;
            margin-bottom: 30px;
            overflow: hidden;
        }

        /* 頂部標題區塊 */
        .admin-card-header {
            background-color: #9E76B4;
            color: white;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* 表格樣式美化 */
        .table th {
            background-color: #f8f9fa;
            color: #495057;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap; 
        }
        .table td {
            text-align: center;
            vertical-align: middle;
        }

        /* 自訂紫色按鈕 */
        .btn-custom {
            background-color: #9E76B4;
            border-color: #9E76B4;
            color: white;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #7d5b92;
            border-color: #7d5b92;
            color: white;
        }

        /* 返回按鈕美化 */
        .btn-back {
            background-color: #6c757d;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-back:hover {
            background-color: #5a6268;
            color: white;
        }
    </style>
</head>
<body>

<div class="container py-5">
    
    <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: #9E76B4;"><i class="bi bi-journal-plus me-2"></i>メニュー管理</h2>
    </div>

    <div th:if="${error}" class="alert alert-danger shadow-sm border-0 rounded-3 d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
        <div th:text="${error}"></div>
    </div>

    <div class="admin-card">
        <div class="admin-card-header">
            <i class="bi bi-plus-circle me-2"></i>メニュー追加
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/menu/add}" th:object="${newMenu}" method="post" enctype="multipart/form-data">
                <div class="row g-3 align-items-end">
                    
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary small">名前</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>
                    
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary small">価額 (円)</label>
                        <input type="number" class="form-control" th:field="*{price}" required>
                    </div>
                    
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary small">提供日</label>
                        <input type="date" class="form-control" th:field="*{provideDate}" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary small">説明</label>
                        <input type="text" class="form-control" th:field="*{description}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary small">画像アップロード</label>
                        <input type="file" name="imageFile" class="form-control" accept="image/*">
                    </div>

                    <div class="col-md-1">
                        <button type="submit" class="btn btn-custom w-100 fw-bold">追加</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card-header bg-dark text-white">
            <i class="bi bi-list-ul me-2"></i>メニュー一覧
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>画像</th>
                            <th>名前</th>
                            <th>価額</th>
                            <th>提供日</th>
                            <th>說明</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${menus}">
                            <td class="text-muted" th:text="${m.id}"></td>
                            <td>
                                <img th:if="${m.photo != null}" th:src="${m.photo}" 
                                     alt="Menu Image" 
                                     style="width: 80px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd;">
                                <span th:if="${m.photo == null}" class="text-muted small">画像なし</span>
                            </td>
                            <td class="fw-bold" th:text="${m.name}"></td>
                            <td class="text-danger fw-bold" th:text="${m.price} + ' 円'"></td>
                            <td th:text="${m.provideDate}"></td>
                            <td class="text-start text-muted small" th:text="${m.description}"></td>
                            <td>
                                <form th:action="@{/admin/menu/delete}" method="post" style="display:inline;">
                                    <input type="hidden" name="id" th:value="${m.id}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('削除しますか？')">
                                        <i class="bi bi-trash3"></i> 削除
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="text-center mt-4 mb-5">
        <button type="button" class="btn-back shadow-sm" onclick="location.href='/admin/adminprofile'">
            <i class="bi bi-arrow-left me-1"></i> プロフィールに戻る
        </button>
    </div>

</div>

</body>
</html>
