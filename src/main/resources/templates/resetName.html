<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前のリセット - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .reset-card {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
            border-radius: 20px !important;
            border: none !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        .header-icon {
            font-size: 3.5rem;
            color: #9E76B4;
            margin-bottom: 15px;
        }
        .btn-custom {
            background-color: #9E76B4;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            padding: 12px;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #7d5b92;
            transform: translateY(-2px);
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #9E76B4;
            box-shadow: 0 0 0 0.25rem rgba(158, 118, 180, 0.25);
        }
        .link-back {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .link-back:hover {
            color: #9E76B4;
            text-decoration: underline;
        }
        .alert-custom {
            border-radius: 10px;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card reset-card p-4 p-md-5">
        <div class="text-center">
            <i class="bi bi-person-gear header-icon"></i>
            <h3 class="fw-bold mb-2">名前のリセット</h3>
            <p class="text-muted small mb-4">新しい表示名を入力してください。</p>
        </div>

        <div th:if="${message}" class="alert alert-success alert-custom p-2 mb-3" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger alert-custom p-2 mb-3" th:text="${error}"></div>

        <form th:action="@{/resetName_2}" method="POST">
            <div class="mb-4">
                <label class="form-label fw-bold text-muted small"><i class="bi bi-person me-1"></i> 新しいお名前</label>
                <input type="text" name="newname" class="form-control" placeholder="新しい名前を入力" required autocomplete="off">
            </div>
            
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-custom">
                    <i class="bi bi-check-lg me-2"></i>リセットを確定する
                </button>
            </div>
        </form>

        <div class="text-center mt-4 border-top pt-3">
            <a href="/profile" class="link-back d-block mb-2">
                <i class="bi bi-arrow-left me-1"></i> プロフィールに戻る
            </a>
            <a href="/login" class="link-back small">
                <i class="bi bi-box-arrow-in-right me-1"></i> ログイン画面へ
            </a>
        </div>
    </div>
</div>
</body>
</html>
