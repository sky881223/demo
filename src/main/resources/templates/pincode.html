<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>認証番号</title>
    <style>
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .btn-register {
            width: 100%;
            padding: 10px;
            background-color: #42b72a; 
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<div class="container">
    <h2>認証番号入力</h2>
    <form action="/verifyCode" method="post">
        <p th:if="${error}" th:text="${error}" style="color: red;"></p>
        <input type="text" name = "verifyCode" placeholder="認証番号入力" required>
        <button type="submit" class="btn-register">確認</button>
    </form>
</div>
