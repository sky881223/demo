<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>認証コード - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%); min-height: 100vh; display: flex; align-items: center; }
        .custom-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 20px; animation: fadeIn 0.5s; }
        .code-input { letter-spacing: 10px; font-size: 1.5rem; text-align: center; border-radius: 12px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card custom-card border-0 shadow">
                <div class="card-body p-5">
                    <h4 class="fw-bold mb-3">メール認証</h4>
                    <p class="text-muted small mb-4">登録されたメールアドレスに送信された6桁のコードを入力してください。</p>
                    
                    <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>

                    <form action="/verifyCode" method="post">
                        <div class="mb-4">
                            <input type="text" name="verifyCode" class="form-control code-input" placeholder="000000" maxlength="6" required autofocus>
                        </div>
                        <button type="submit" class="btn w-100 py-2 fw-bold" style="background:#9E76B4; color:white; border-radius:12px;">確認</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
