<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - Demo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .custom-card {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 20px !important;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-login-custom {
            background: linear-gradient(45deg, #9E76B4, #7d5b92);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
        }
        .form-text { font-size: 0.75rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card custom-card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #9E76B4;"></i>
                        <h3 class="fw-bold mt-2">アカウント作成</h3>
                    </div>

                    <div th:if="${error}" class="alert alert-danger p-2 small text-center" th:text="${error}"></div>

                    <form action="/saveUser" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small">お名前</label>
                            <input type="text" name="name" class="form-control shadow-sm" style="border-radius:10px" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">メールアドレス</label>
                            <input type="email" name="email" class="form-control shadow-sm" style="border-radius:10px" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small">パスワード</label>
                            <input type="password" name="password" class="form-control shadow-sm" style="border-radius:10px" required>
                            <div class="form-text text-muted mt-2">
                                <i class="bi bi-info-circle me-1"></i>8文字以上、大文字・小文字・数字を含めてください。
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-login-custom py-2">認証コードを送信</button>
                        </div>
                    </form>
                    
                    <hr class="my-4 text-muted">
                    <div class="text-center">
                        <a href="/login" class="text-decoration-none small" style="color:#9E76B4">既にアカウントをお持ちの方</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
