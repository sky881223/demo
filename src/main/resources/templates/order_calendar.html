<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文カレンダー</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        
        /* 控制日曆的大小與外觀 */
        #calendar {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* 讓日曆標題的顏色符合你之前的風格 */
        .fc-toolbar-title {
            color: #9E76B4;
            font-weight: bold;
        }

        /* 底部按鈕的自訂樣式 */
        .btn-back {
            background-color: #6c757d;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4 fw-bold" style="color: #9E76B4;">私の注文カレンダー</h2>
    
    <div id='calendar'></div>
    
    <div class="text-center mt-4">
        <button type="button" class="btn-back" onclick="location.href='/profile'">プロフィールに戻る</button>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');

        // 1. 取得 Spring Boot 傳過來的訂單清單
        // Thymeleaf 會自動把 Java 的 List 轉換成 JavaScript 的 Array (JSON格式)
        var orderList = /*[[${orders}]]*/ []; 

        // 2. 把訂單資料轉換成 FullCalendar 看得懂的格式
        var calendarEvents = orderList.map(function(order) {
            
            // 決定顏色：已付款顯示綠色，未付款顯示紅色 (兼容字串 'true' 和布林值 true)
            var isPaid = (order.paymentStatus === 'true' || order.paymentStatus === true);
            var eventColor = isPaid ? '#28a745' : '#dc3545';
            var eventTitle = isPaid ? '済: ' : '未: ';
            
            // 確保有總金額，如果沒有就顯示 0
            var totalAmount = order.total ? order.total : 0;

            return {
                title: eventTitle + totalAmount + '円', // 日曆上顯示的文字 (例如: 済: 500円)
                start: order.orderTime,                // 訂單日期時間 (對應實體類的變數名稱)
                color: eventColor                      // 標籤顏色
            };
        });

        // 3. 畫出日曆
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth', // 預設顯示「月」視圖
            locale: 'ja',                // 設定為日文 (顯示 月、火、水...)
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth' // 月曆視圖 與 列表視圖切換
            },
            buttonText: {
                today: '今日',
                month: '月',
                list: 'リスト' // 列表按鈕的日文翻譯
            },
            events: calendarEvents       // 把剛才準備好的訂單資料塞進去！
        });

        calendar.render(); // 執行渲染
    });
</script>

</body>
</html>
