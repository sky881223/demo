<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー注文履歴 (管理者)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .table th {
            background-color: #9E76B4;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
            color: white;
        }

        .table td {
            text-align: center;
            vertical-align: middle;
        }

        .price-text {
            color: #d9534f;
            font-weight: bold;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .btn-back {
            background-color: #6c757d;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }

        /* 日曆專屬樣式 */
        #calendar {
            max-width: 100%;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .fc-toolbar-title {
            color: #9E76B4;
            font-weight: bold;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mb-5">
        <h2 class="text-center mt-5 mb-4 fw-bold" style="color: #9E76B4;">ユーザー注文履歴</h2>

        <!-- 本日のサマリー統計 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-body d-flex justify-content-between align-items-center py-3" style="background-color: #fdfcff; border-left: 5px solid #9E76B4; border-radius: 15px;">
                        <div>
                            <h5 class="mb-1 fw-bold" style="color: #9E76B4;"><i class="bi bi-people-fill me-2"></i>本日の注文人数</h5>
                            <p class="text-muted small mb-0">今日これまでに注文したユニークユーザー数です</p>
                        </div>
                        <div class="text-end">
                            <h2 class="mb-0 fw-bold" id="todayUserCount" style="color: #9E76B4;">0 <span class="fs-6 text-muted">名</span></h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">

            <div class="col-md-6">
                <div class="card shadow-sm border-danger h-100">
                    <div class="card-header bg-danger text-white fw-bold text-center">
                        未払い（未付款）: <span
                            th:text="${unpaymentstatusOrders != null ? #lists.size(unpaymentstatusOrders) : 0}">0</span>
                        件
                    </div>

                    <ul class="list-group list-group-flush" style="max-height: 200px; overflow-y: auto;"
                        th:if="${not #lists.isEmpty(unpaymentstatusOrders)}">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            th:each="order : ${unpaymentstatusOrders}">
                            <span class="fw-bold" 
                                  th:text="${(order.user != null ? 'ID:' + order.user.id + ' - ' : '') + (order.user?.username ?: '不明なユーザー')}">ID:1 - うちはマダラ</span>
                            <span class="badge bg-danger rounded-pill"
                                th:text="${order.total != null ? order.total + '円' : '0円'}">500円</span>
                        </li>
                    </ul>

                    <div class="card-body text-center text-muted" th:if="${#lists.isEmpty(unpaymentstatusOrders)}">
                        未払いのユーザーはいません 🎉
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-success h-100">
                    <div class="card-header bg-success text-white fw-bold text-center">
                        支払済（已付款）: <span
                            th:text="${paymentstatusOrders != null ? #lists.size(paymentstatusOrders) : 0}">0</span> 件
                    </div>

                    <ul class="list-group list-group-flush" style="max-height: 200px; overflow-y: auto;"
                        th:if="${not #lists.isEmpty(paymentstatusOrders)}">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            th:each="order : ${paymentstatusOrders}">
                            <span class="fw-bold" 
                                  th:text="${(order.user != null ? 'ID:' + order.user.id + ' - ' : '') + (order.user?.username ?: '不明なユーザー')}">ID:1 - うちはマダラ</span>
                            <span class="badge bg-success rounded-pill"
                                th:text="${order.total != null ? order.total + '円' : '0円'}">500円</span>
                        </li>
                    </ul>

                    <div class="card-body text-center text-muted" th:if="${#lists.isEmpty(paymentstatusOrders)}">
                        まだ支払済のユーザーはいません
                    </div>
                </div>
            </div>

        </div>

        <!-- 銷售統計圖表 -->
        <div class="row mb-4" th:if="${not #lists.isEmpty(orders)}">
            <div class="col-12">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold" style="color: #9E76B4;">
                        <i class="bi bi-graph-up-arrow me-2"></i>売上統計 (日別)
                    </div>
                    <div class="card-body">
                        <canvas id="salesChart" style="max-height: 250px; width: 100%;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-warning text-center shadow-sm">
            <h4>注文履歴がありません。</h4>
        </div>

        <div th:if="${not #lists.isEmpty(orders)}">

            <div id='calendar'></div>

            <div class="table-responsive">
                <table class="table table-hover table-bordered shadow-sm bg-white">
                    <thead class="table-dark">
                        <tr>
                            <th>ユーザー</th>
                            <th>注文名</th>
                            <th>値段</th>
                            <th>量</th>
                            <th>合計金額</th>
                            <th>支払い状況</th>
                            <th>注文日時</th>
                            <th>備考</th>
                            <th>キャンセル</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${(order.user != null ? 'ID:' + order.user.id + ' - ' : '') + (order.user?.username ?: '不明なユーザー')}">
                                ID:1 - うちはマダラ</td>

                            <td>
                                <div th:each="detail : ${order.orderDetails}" th:text="${detail.menu.name}"></div>
                            </td>
                            <td>
                                <div th:each="detail : ${order.orderDetails}" th:text="${detail.price} + '円'"></div>
                            </td>
                            <td>
                                <div th:each="detail : ${order.orderDetails}" th:text="${detail.quantity}"></div>
                            </td>

                            <td class="price-text">
                                <span th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 0, 'POINT')}">0</span>円
                            </td>

                            <td>
                                <span
                                    th:class="${order.paymentStatus == 'true' ? 'badge bg-success' : 'badge bg-secondary'}"
                                    th:text="${order.paymentStatus == 'true' ? '支払済' : '未払い'}">未払い</span>
                            </td>

                            <td class="small"
                                th:text="${order.orderTime != null and order.orderTime.length() >= 16 ? #strings.replace(#strings.substring(order.orderTime, 0, 16), 'T', ' ') : '時間不明'}">
                            </td>

                            <td class="small text-muted" th:text="${order.note ?: '-'}">-</td>

                            <td>
                                <form th:action="@{/admin/admin_cancel-order}" method="post" style="display:inline;">
                                    <input type="hidden" name="orderId" th:value="${order.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('本当にキャンセルしますか？');">キャンセル</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center mt-4">
            <button type="button" class="btn-back" onclick="location.href='/admin/adminprofile'">管理者プロフィールに戻る</button>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            if (!calendarEl) return;

            var calendarEvents = [];
            var salesData = {}; // 用於統計每日銷售額
            
            // 取得今日日期 (格式: YYYY-MM-DD)
            var now = new Date();
            var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            var todayUsers = new Set(); // 用於統計今日不重複的人數

            // 使用 Thymeleaf 的 JS 迴圈，安全地一筆一筆塞入資料
            /*[# th:each="order : ${orders}"]*/

            var paymentStatus = /*[[${order.paymentStatus}]]*/ 'false';
            var isPaid = (paymentStatus === 'true' || paymentStatus === true);
            var total = /*[[${order.total}]]*/ 0;
            var orderTime = /*[[${order.orderTime}]]*/ '';
            var username = /*[[${order.user?.username}]]*/ '不明';
            var userId = /*[[${order.user?.id}]]*/ null;

            // 管理員日曆標題：加上用戶名，方便辨識
            var eventTitle = username + (isPaid ? ' (済) ' : ' (未) ') + total + '円';

            calendarEvents.push({
                title: eventTitle,
                start: orderTime,
                color: isPaid ? '#28a745' : '#dc3545'
            });
            
            // 統計數據處理：將日期 (YYYY-MM-DD) 作為 Key，加總銷售額
            if (orderTime && orderTime.length >= 10) {
                var dateKey = orderTime.substring(0, 10);
                salesData[dateKey] = (salesData[dateKey] || 0) + total;
            }

            // 統計今日人數
            if (orderTime && orderTime.substring(0, 10) === today) {
                // 以 ID 作為唯一辨識，若無 ID 則用用戶名
                todayUsers.add(userId || username);
            }

            /*[/]*/

            // 更新今日人數顯示
            document.getElementById('todayUserCount').innerHTML = todayUsers.size + ' <span class="fs-6 text-muted">名</span>';

            // 建立並渲染日曆
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                buttonText: {
                    today: '今日',
                    month: '月',
                    list: 'リスト'
                },
                events: calendarEvents
            });

            calendar.render();

            // 渲染銷售圖表 (Chart.js)
            var ctx = document.getElementById('salesChart');
            if (ctx) {
                var sortedDates = Object.keys(salesData).sort();
                var chartLabels = sortedDates;
                var chartValues = sortedDates.map(function(date) { return salesData[date]; });

                new Chart(ctx.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: '売上合計 (円)',
                            data: chartValues,
                            borderColor: '#9E76B4',
                            backgroundColor: 'rgba(158, 118, 180, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        });
    </script>

</body>

</html>
